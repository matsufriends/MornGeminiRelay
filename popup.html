<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>MornGeminiRelay</title>
<style>
  :root { --edge: 12px; --panel: 8px; --gap: 8px; --section: 16px; }
  body { width: 320px; margin: 0; padding: var(--edge); font: 13px sans-serif; }
  label { display: block; margin-bottom: var(--gap); }
  .slack-row { display: flex; gap: var(--gap); margin-bottom: var(--gap); }
  input, button, select { font: inherit; padding: var(--panel); }
  input, select { flex: 1; min-width: 0; }
  button:enabled { cursor: pointer; }
  #list, #export { width: 100%; margin-top: var(--section); }
  #list + .slack-row { margin-top: var(--gap); }
  #status { margin-top: var(--gap); overflow-wrap: anywhere; }
  @media (hover: hover) { button:enabled:hover { filter: brightness(0.9); } }
</style>
<label for="slackToken">Slack Bot Token / チャンネル ID</label>
<div class="slack-row">
  <input id="slackToken" type="password" placeholder="xoxb-..." aria-label="Slack Bot Token">
</div>
<div class="slack-row">
  <input id="slackChannel" placeholder="C0123456789" aria-label="Slack チャンネル ID">
</div>
<label for="nickname">Slack での表示名</label>
<div class="slack-row">
  <input id="nickname" placeholder="空欄なら Google アカウント名">
  <button id="save">保存</button>
</div>
<p>転送を有効にすると、Gemini の質問・回答・生成コード・Canvas HTML・表示名・添付ファイル名を指定の Slack チャンネルへ送ります。</p>
<label><input id="relayEnabled" type="checkbox"> Slack への転送に同意して有効にする</label>
<p><a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a> · 設定を変更したら「保存」を押してください。</p>
<button id="list">全チャットを取得</button>
<div class="slack-row">
  <select id="chat" aria-label="Slack に送るチャット" disabled><option>先に全チャットを取得してください</option></select>
  <button id="send" disabled>送信</button>
</div>
<button id="export">Gemini を開いて履歴を保存</button>
<div id="status" role="status"></div>
<script src="popup.js"></script>
</html>
